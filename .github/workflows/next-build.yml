name: Stillwater Next build

on:
  push:
    branches: [feature/deeper-payment-v1]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip lock]') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: next-app/package-lock.json
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit refreshed lockfile
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add next-app/package-lock.json
          git diff --cached --quiet || git commit -m "chore(build): refresh Next lockfile [skip lock]"
          git push
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/stillwater-build.log
          exit ${PIPESTATUS[0]}
      - name: Persist build log
        if: steps.build.outcome == 'failure'
        working-directory: .
        run: |
          cp /tmp/stillwater-build.log next-app-build.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add next-app-build.log
          git commit -m "ci(build): capture failed build log [skip lock]"
          git push
      - name: Fail workflow after log capture
        if: steps.build.outcome == 'failure'
        run: exit 1
