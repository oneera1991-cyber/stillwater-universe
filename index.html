<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Stillwater</title>
<style>
:root{--bg:#091522;--ivory:#f1eadc;--mist:#c7c0b2;--gold:#d8aa69;--line:rgba(216,170,105,.45)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ivory);font-family:Arial,"Helvetica Neue",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}
.app{position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg)}
.scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:28px 20px;opacity:0;pointer-events:none;transform:scale(1.015);transition:opacity .8s ease,transform 1.2s ease;isolation:isolate;background:var(--bg)}
.scene.active{opacity:1;pointer-events:auto;transform:none}
.scene:before{content:"";position:absolute;inset:0;background-position:center;background-size:cover;background-repeat:no-repeat;z-index:0;transition:transform 18s ease-out;will-change:transform}
.scene:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,18,29,.16),rgba(7,18,29,.18) 35%,rgba(7,18,29,.76) 100%);z-index:1;pointer-events:none}
#door:before{background-image:url('https://raw.githubusercontent.com/oneera1991-cyber/stillwater-universe/test/golden-portal-v6/next-app/public/images/vera/scene-01-portal.png');background-position:center 52%}#welcome:before{background-image:url('https://raw.githubusercontent.com/oneera1991-cyber/stillwater-universe/test/golden-portal-v6/next-app/public/images/vera/scene-02-vera-welcome.png');background-position:center 45%}#form:before{background-image:url('https://raw.githubusercontent.com/oneera1991-cyber/stillwater-universe/test/golden-portal-v6/next-app/public/images/vera/scene-03-tarot-form.png');background-position:center 24%}
.content{position:relative;z-index:2;width:min(100%,560px);text-align:center}.door-art{display:none}.tag{margin:0 0 18px;font-size:11px;letter-spacing:.28em;color:#f0d9ae;text-transform:uppercase;text-shadow:0 1px 14px #030c14}.title{margin:0 0 12px;font:400 clamp(42px,11vw,76px)/1.1 Georgia,Cambria,serif;letter-spacing:.16em;color:#fffaf0;text-shadow:0 2px 26px rgba(3,12,20,.95)}.support{margin:0 0 38px;font:400 17px/1.7 Georgia,Cambria,serif;color:#f1eadc;text-shadow:0 1px 14px rgba(3,12,20,.95)}.btn{min-height:3.25rem;border:1px solid var(--line);border-radius:2px;padding:14px 28px;background:rgba(7,18,29,.56);color:#fffaf0;letter-spacing:.12em;text-transform:uppercase;font-size:12px;backdrop-filter:blur(6px);transition:.3s}.btn:hover{background:var(--gold);border-color:var(--gold);color:#091522;box-shadow:0 0 28px rgba(216,170,105,.22)}.quiet{border:0;background:none;color:rgba(241,234,220,.7);font-size:12px;margin-top:16px}.welcome h2,.form h2{font:300 clamp(26px,7vw,40px)/1.25 Georgia,Cambria,serif;color:#fffaf0;margin:0 0 12px;text-shadow:0 2px 20px rgba(3,12,20,.95)}.welcome p,.form .lead{color:#f1eadc;line-height:1.7;margin:0 0 28px;text-shadow:0 1px 14px rgba(3,12,20,.95)}.form{text-align:left;max-height:92vh;overflow:auto;padding:10px 2px 30px}.form h2,.form .lead{text-align:center}.field{display:flex;flex-direction:column;gap:8px;margin:16px 0}.field label{font-size:11px;color:#d6c9b2;letter-spacing:.12em}.field input,.field textarea{width:100%;border:1px solid rgba(206,185,151,.28);border-radius:2px;background:rgba(8,19,29,.78);color:var(--ivory);padding:13px 14px;outline:none}.field textarea{min-height:110px;resize:vertical}.field input:focus,.field textarea:focus{border-color:rgba(216,170,105,.72)}.hint{font-size:11px;line-height:1.6;color:rgba(221,215,204,.68)}.error{color:#f0b8b8;font-size:13px;line-height:1.6;margin:12px 0}.card{width:min(220px,55vw);aspect-ratio:2/3;margin:0 auto 18px;border-radius:8px;object-fit:cover;border:1px solid rgba(235,225,195,.5);box-shadow:0 20px 60px rgba(0,0,0,.55)}.reading{font:16px/1.9 Georgia,Cambria,serif;color:#f1eadc;text-align:left;white-space:pre-line;margin:20px 0}.payment{width:min(100%,430px);margin:auto;border:1px solid rgba(216,170,105,.3);background:rgba(8,19,29,.78);padding:22px}.price{font:28px Arial,sans-serif;margin:0 0 12px}.qr{width:min(260px,75vw);display:block;background:#fff;padding:8px;border-radius:8px;margin:18px auto}.status{font:13px/1.7 Arial,sans-serif;color:var(--mist);min-height:24px}.slip{margin-top:18px;padding-top:18px;border-top:1px solid rgba(216,170,105,.25)}.slip input{width:100%;color:var(--mist);font-size:12px}.hidden{display:none!important}
.lang-switch{position:fixed;top:18px;right:18px;z-index:20;display:flex;align-items:center;border:1px solid rgba(216,170,105,.35);background:rgba(7,18,29,.58);backdrop-filter:blur(8px);border-radius:2px;overflow:hidden}.lang-btn{border:0;background:transparent;color:rgba(241,234,220,.65);padding:8px 10px;font-size:10px;letter-spacing:.12em}.lang-btn.active{background:rgba(216,170,105,.18);color:#fffaf0}.lang-sep{width:1px;height:14px;background:rgba(216,170,105,.25)}
@media(prefers-reduced-motion:no-preference){.scene.active:before{transform:scale(1.04)}}
</style></head>
<body><main class="app">
<div class="lang-switch" role="group" aria-label="Language"><button class="lang-btn" id="langTh" type="button">TH</button><span class="lang-sep"></span><button class="lang-btn" id="langEn" type="button">EN</button></div>
<section id="door" class="scene active"><div class="content"><p class="tag" id="doorTag"></p><h1 class="title">STILLWATER</h1><p class="support" id="doorSupport"></p><button class="btn" id="meet"></button></div></section>
<section id="welcome" class="scene"><div class="content welcome"><p class="tag" id="welcomeTag"></p><h2 id="welcomeTitle"></h2><p id="welcomeCopy"></p><button class="btn" id="ready"></button><br><button class="quiet" data-back="door" id="welcomeBack"></button></div></section>
<section id="form" class="scene"><div class="content form"><p class="tag" id="formTag"></p><h2 id="formTitle"></h2><p class="lead" id="formLead"></p><form id="questionForm"><div class="field"><label id="questionLabel"></label><textarea id="question" maxlength="500" required></textarea></div><div class="field"><label id="birthLabel"></label><input id="birthdate" type="text" inputmode="numeric" autocomplete="bday" required></div><div class="field"><label id="birthTimeLabel"></label><input id="birthtime" type="time"></div><p class="hint" id="formHint"></p><div id="formError" class="error"></div><button class="btn" id="submitQuestion" style="width:100%"></button></form><button class="quiet" data-back="welcome" id="formBack"></button></div></section>
<section id="draw" class="scene"><div class="content"><p class="tag" id="drawTag"></p><p id="drawStatus" class="support"></p><img id="card" class="card hidden" alt="Tarot card"><h2 id="cardName" style="font:300 28px Georgia,serif"></h2><div id="firstReading" class="reading"></div><button id="deeper" class="btn hidden"></button><div id="drawError" class="error"></div></div></section>
<section id="payment" class="scene"><div class="content"><p class="tag" id="paymentTag"></p><h2 id="paymentTitle" style="font:300 30px Georgia,serif"></h2><div class="payment"><p class="price">฿59</p><button id="pay" class="btn"></button><img id="qr" class="qr hidden" alt="PromptPay QR"><div id="payee" class="status"></div><div id="payStatus" class="status"></div><div id="slip" class="slip hidden"><label class="hint" id="slipLabel"></label><input id="slipFile" type="file" accept="image/jpeg,image/png"></div></div><button class="quiet" data-back="draw" id="paymentBack"></button></div></section>
<section id="full" class="scene"><div class="content form"><p class="tag" id="fullTag"></p><h2 id="fullTitle" style="text-align:center;font:300 30px Georgia,serif"></h2><div id="fullReading" class="reading"></div><button class="btn" data-back="door" id="fullBack"></button></div></section>
</main>
<script type="module">
import { STRINGS, DEFAULT_LANG, normLang } from '/i18n/strings.js';

const $=id=>document.getElementById(id);
let order=null,paid=null,paymentId=null,poll=null;
let currentLang=normLang(localStorage.getItem('stillwater_lang')||DEFAULT_LANG);

const COPY={
  th:{
    doorTag:'สถานที่ที่เงียบพอให้คุณได้ฟังตัวเอง',doorSupport:'พื้นที่สำหรับคำถามที่คุณกำลังแบกไว้',meet:'พบพี่เวรา',
    welcomeTag:'',welcomeTitle:'พี่กำลังรออยู่เลยค่ะ',welcomeCopy:'มานั่งด้วยกันนะคะ',ready:'พร้อมแล้ว',back:'กลับ',
    formTag:'คำถามของคุณ',formTitle:'มีเรื่องอะไรที่ยังค้างอยู่ในใจ?',formLead:'เล่าให้พี่ฟังได้เลยค่ะ คุณอยากเข้าใจเรื่องอะไรมากที่สุด?',questionLabel:'คำถามของคุณ',questionPlaceholder:'พิมพ์คำถามที่คุณอยากรู้ที่สุด...',birthLabel:'วันเดือนปีเกิดของคุณ',birthPlaceholder:'วว/ดด/ปปปป',birthTimeLabel:'เวลาเกิด (ไม่จำเป็น)',formHint:'พี่เวรายังไม่รับคำถามเรื่องการวินิจฉัยทางการแพทย์ กฎหมาย หรือการตัดสินใจทางการเงินครั้งใหญ่ค่ะ เรื่องบางอย่างควรได้รับคำแนะนำจากผู้เชี่ยวชาญ',submit:'พร้อมรับคำตอบ',
    drawTag:'คำตอบแรก',drawStatus:'รอให้คำตอบเดินทางมาหาคุณ',deeper:'เปิดต่อ — ฿59',
    paymentTag:'การเปิดไพ่ต่อ',paymentTitle:'เปิดคำอ่านต่อ',pay:'เข้าสู่การชำระเงิน',slipLabel:'หลังชำระเงินแล้ว แนบสลิป PromptPay ได้เลยค่ะ',paymentBack:'กลับไปดูคำตอบเดิม',
    fullTag:'คำอ่านฉบับเต็ม',fullTitle:'สิ่งที่ไพ่ทั้งชุดอยากให้คุณเห็น',fullBack:'กลับสู่ STILLWATER',
    errors:{question:'พิมพ์คำถามสักนิดก่อนนะคะ',read:'ยังเปิดคำตอบไม่ได้ค่ะ ลองใหม่อีกครั้งนะคะ',safety:'คำถามนี้เหมาะกับการขอความช่วยเหลือจากผู้เชี่ยวชาญมากกว่าค่ะ',rewrite:'ลองเล่าเป็นคำถามอีกครั้งนะคะ',expired:'คำถามนี้หมดอายุแล้ว กรุณาเริ่มใหม่อีกครั้งค่ะ',payment:'ยังไม่สามารถเปิดการชำระเงินได้ค่ะ',slip:'ตรวจสลิปไม่สำเร็จค่ะ',opening:'กำลังเปิดคำอ่านต่อให้คุณค่ะ'}
  },
  en:{
    doorTag:'A QUIETER PLACE TO LISTEN',doorSupport:'A place for the questions you carry.',meet:'MEET VERA',
    welcomeTag:'',welcomeTitle:"I've been waiting for you.",welcomeCopy:'Come, sit with me.',ready:"I'M READY",back:'Back',
    formTag:'YOUR QUESTION',formTitle:"What's been weighing on your mind?",formLead:"Tell me what's on your heart. What would you most like to understand?",questionLabel:'YOUR QUESTION',questionPlaceholder:'Type the question you most want answered...',birthLabel:'YOUR DATE OF BIRTH',birthPlaceholder:'DD/MM/YYYY',birthTimeLabel:'TIME OF BIRTH (OPTIONAL)',formHint:"I can't offer guidance on medical diagnoses, legal matters, or major financial decisions. Some questions deserve support from a qualified professional.",submit:"I'M READY FOR MY ANSWER",
    drawTag:'THE FIRST ANSWER',drawStatus:'Let the answer come to you.',deeper:'GO DEEPER — ฿59',
    paymentTag:'THE OFFERING',paymentTitle:'Continue the reading',pay:'CREATE PAYMENT',slipLabel:'After payment, upload your PromptPay slip.',paymentBack:'Back',
    fullTag:'THE FULL READING',fullTitle:'What the cards want you to see',fullBack:'RETURN TO STILLWATER',
    errors:{question:'Please enter your question.',read:'Unable to read right now.',safety:'This question needs a different kind of support.',rewrite:'Please rephrase your question.',expired:'Your reading has expired. Please start again.',payment:'Payment could not be created.',slip:'Slip verification failed.',opening:'Opening your deeper reading...'}
  }
};

function copy(){return COPY[currentLang]||COPY.en}
function setText(id,text){$(id).textContent=text}
function applyLanguage(lang){
  currentLang=normLang(lang);localStorage.setItem('stillwater_lang',currentLang);document.documentElement.lang=currentLang;
  const c=copy();
  setText('doorTag',c.doorTag);setText('doorSupport',c.doorSupport);setText('meet',c.meet);
  setText('welcomeTag',c.welcomeTag);setText('welcomeTitle',c.welcomeTitle);setText('welcomeCopy',c.welcomeCopy);setText('ready',c.ready);setText('welcomeBack',c.back);
  setText('formTag',c.formTag);setText('formTitle',c.formTitle);setText('formLead',c.formLead);setText('questionLabel',c.questionLabel);setText('birthLabel',c.birthLabel);setText('birthTimeLabel',c.birthTimeLabel);setText('formHint',c.formHint);setText('submitQuestion',c.submit);setText('formBack',c.back);$('question').placeholder=c.questionPlaceholder;$('birthdate').placeholder=c.birthPlaceholder;
  setText('drawTag',c.drawTag);setText('drawStatus',c.drawStatus);setText('deeper',c.deeper);
  setText('paymentTag',c.paymentTag);setText('paymentTitle',c.paymentTitle);setText('pay',c.pay);setText('slipLabel',c.slipLabel);setText('paymentBack',c.paymentBack);
  setText('fullTag',c.fullTag);setText('fullTitle',c.fullTitle);setText('fullBack',c.fullBack);
  $('langTh').classList.toggle('active',currentLang==='th');$('langEn').classList.toggle('active',currentLang==='en');
}
$('langTh').onclick=()=>applyLanguage('th');$('langEn').onclick=()=>applyLanguage('en');
applyLanguage(currentLang);

function show(id){document.querySelectorAll('.scene').forEach(s=>s.classList.toggle('active',s.id===id))}
$('meet').onclick=()=>show('welcome');$('ready').onclick=()=>show('form');document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>show(b.dataset.back));

async function read(){
  const q=$('question').value.trim();const c=copy();
  if(!q){$('formError').textContent=c.errors.question;return}
  show('draw');$('drawError').textContent='';$('card').classList.add('hidden');$('deeper').classList.add('hidden');$('drawStatus').textContent=c.drawStatus;
  try{
    const r=await fetch('/api/read',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,lang:currentLang})});
    const d=await r.json();if(!r.ok)throw Error(d.error||c.errors.read);
    if(d.safety){$('drawError').textContent=d.message||c.errors.safety;return}
    if(d.needs_rewrite){show('form');$('formError').textContent=d.message||c.errors.rewrite;return}
    order=d.order;$('card').src=d.card.image||d.card.file||'';$('card').classList.remove('hidden');$('cardName').textContent=d.card.name||'';$('firstReading').textContent=d.card.text||'';$('deeper').classList.remove('hidden');
  }catch(e){$('drawError').textContent=e.message||c.errors.read}
}
$('questionForm').onsubmit=e=>{e.preventDefault();read()};$('deeper').onclick=()=>{show('payment');$('payStatus').textContent=''};

async function createPayment(){
  const c=copy();if(!order){$('payStatus').textContent=c.errors.expired;return}$('pay').disabled=true;$('payStatus').textContent=c.errors.opening;
  try{const r=await fetch('/api/payment/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({order})});const d=await r.json();if(!r.ok)throw Error(d.error||d.code||c.errors.payment);if(d.order)order=d.order;paymentId=d.paymentId||null;if(d.qr){$('qr').src=d.qr;$('qr').classList.remove('hidden')}if(d.payee)$('payee').textContent=typeof d.payee==='string'?d.payee:(d.payee[currentLang]||d.payee.en||d.payee.th||'');$('slip').classList.toggle('hidden',d.flow!=='slip');$('payStatus').textContent=d.flow==='slip'?(currentLang==='th'?'โอน ฿59 แล้วแนบสลิปด้านล่างนะคะ':'Pay ฿59, then upload your slip.'):(currentLang==='th'?'ชำระเงินเพื่อดำเนินการต่อค่ะ':'Complete payment to continue.');if(paymentId)startPoll()}catch(e){$('payStatus').textContent=e.message||c.errors.payment;$('pay').disabled=false}}
$('pay').onclick=createPayment;

async function verifySlip(file){if(!order)return;const c=copy();$('payStatus').textContent=currentLang==='th'?'กำลังตรวจสลิปให้นะคะ…':'Checking your slip...';const fd=new FormData();fd.append('order',order);fd.append('slip',file);try{const r=await fetch('/api/payment/verify-slip',{method:'POST',body:fd});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.reason||c.errors.slip);paid=d.paid;$('payStatus').textContent=currentLang==='th'?'ชำระเงินเรียบร้อยค่ะ':'Payment confirmed.';await openFull()}catch(e){$('payStatus').textContent=e.message||c.errors.slip}}
$('slipFile').onchange=e=>{const f=e.target.files&&e.target.files[0];if(f)verifySlip(f)};

function startPoll(){if(!paymentId)return;clearInterval(poll);poll=setInterval(async()=>{try{const r=await fetch('/api/payment/status?payment='+encodeURIComponent(paymentId));const d=await r.json();if(d.paid){clearInterval(poll);await openFull()}else if(['failed','expired','reversed'].includes(d.status)){clearInterval(poll);$('payStatus').textContent=currentLang==='th'?'รายการนี้ไม่สำเร็จค่ะ':'Payment was not completed.';$('pay').disabled=false}}catch(e){}},3000)}

async function openFull(){
  const c=copy();show('full');$('fullReading').textContent=c.errors.opening;
  try{const body=paid?{order,paid}:{order,charge:paymentId};const r=await fetch('/api/deeper',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||d.code||c.errors.read);if(d.safety){$('fullReading').textContent=d.message||c.errors.safety;return}let out='';(d.cards||[]).forEach(card=>{out+='\n'+(card.name||'')+'\n\n'+(card.text||'\n')+'\n\n'});if(d.final)out+='\n'+d.final+'\n\n';if(d.closing)out+=d.closing;$('fullReading').textContent=out.trim()}catch(e){$('fullReading').textContent=e.message||c.errors.read}
}
</script></body></html>
