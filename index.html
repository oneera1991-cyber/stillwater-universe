<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stillwater — AI Reading Prototype</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600&family=Cormorant+Garamond:wght@300;400;500;600&display=swap" rel="stylesheet"><style>
:root{--bg:#09081a;--p:rgba(20,17,46,.8);--l:rgba(220,210,255,.16);--t:#f4f0ff;--m:#b9b2d0;--a:#d9c8ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--t);font-family:Anuphan,sans-serif;background:radial-gradient(circle at 50% 0%,#7458d238,transparent 38%),radial-gradient(circle at 20% 80%,#466ebe1f,transparent 35%),var(--bg)}.wrap{max-width:1050px;margin:auto;padding:42px 20px 70px}.brand{text-align:center;font:300 clamp(34px,7vw,64px)/1 "Cormorant Garamond",serif;letter-spacing:.18em}.sub{text-align:center;color:var(--m);margin:12px 0 35px;font-size:13px;letter-spacing:.08em}.panel,.box{border:1px solid var(--l);background:var(--p);backdrop-filter:blur(18px);border-radius:24px;padding:24px;box-shadow:0 20px 80px #00000047}label{display:block;color:var(--m);font-size:13px;margin-bottom:9px}textarea{width:100%;min-height:125px;resize:vertical;border:1px solid var(--l);border-radius:16px;background:#050412a6;color:var(--t);padding:16px;font:400 16px/1.7 Anuphan;outline:none}textarea:focus{border-color:#d9c8ff80}.actions{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}button{border:1px solid #e6dcff4d;border-radius:999px;padding:12px 22px;color:#161126;background:#eee8ff;font:500 15px Anuphan;cursor:pointer}button:disabled{opacity:.45;cursor:wait}.hint,.status,.cost{font-size:12px;color:var(--m)}.status{margin-top:16px;padding:12px;border-radius:14px;background:#ffffff08}.grid{display:grid;grid-template-columns:300px 1fr;gap:18px;margin-top:18px}.box img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:15px;background:#17132d}.name{text-align:center;margin-top:13px;font:400 28px "Cormorant Garamond",serif}.title{font-size:12px;letter-spacing:.12em;color:var(--a);margin-bottom:12px}.analysis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.kv{border:1px solid var(--l);border-radius:14px;padding:12px;background:#ffffff04}.k{font-size:11px;color:var(--m);margin-bottom:4px}.v{font-size:14px}.signals{margin-top:10px;color:#dcd5ec;font-size:14px;line-height:1.7}.reading{white-space:pre-wrap;font-size:16px;line-height:1.95}.cost{margin-top:18px;border-top:1px solid var(--l);padding-top:14px;line-height:1.7}.hidden{display:none}.err{color:#ffb8c7}@media(max-width:760px){.grid{grid-template-columns:1fr}.box:first-child{max-width:280px;margin:auto}.analysis{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><div class="brand">STILLWATER</div><div class="sub">AI READING PROTOTYPE · INTERNAL TEST</div><section class="panel"><label for="q">คำถามของผู้ถาม</label><textarea id="q" placeholder="เช่น เขาไม่ตอบฉันมา 4 วันแล้ว แต่ยังดูสตอรี่ทุกวัน ฉันควรรอเขาไหม"></textarea><div class="actions"><button id="go">✦ ASK VERA</button><span class="hint">ยังไม่มี Payment / Order ID / Database</span></div><div id="s" class="status hidden"></div></section><section id="out" class="hidden"><div class="grid"><div class="box"><div class="title">CARD DRAW</div><img id="img" alt="Tarot card"><div id="name" class="name"></div></div><div class="box"><div class="title">AI QUESTION ANALYSIS</div><div id="a" class="analysis"></div><div id="sig" class="signals"></div><div style="margin-top:26px" class="title">VERA'S READING</div><div id="read" class="reading"></div><div id="cost" class="cost"></div></div></div></section></main><script>
const $=x=>document.getElementById(x),go=$("go");go.onclick=async()=>{let question=$("q").value.trim();if(!question)return $("q").focus();go.disabled=true;$("out").classList.add("hidden");$("s").classList.remove("hidden");$("s").textContent="พี่เวรากำลังฟังคำถามและเปิดไพ่ให้…";try{let r=await fetch("/api/read",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question})}),d=await r.json();if(!r.ok)throw Error(d.error||"เกิดข้อผิดพลาด");let x=d.analysis;$("a").innerHTML=[["เจตนาหลัก",x.intent],["อารมณ์",x.emotional_state],["ระดับอารมณ์",x.emotional_intensity],["สถานการณ์",x.situation],["ความต้องการลึก ๆ",x.core_need],["มุมที่ควรอ่าน",x.reading_angle]].map(z=>`<div class="kv"><div class="k">${esc(z[0])}</div><div class="v">${esc(z[1])}</div></div>`).join("");$("sig").innerHTML="<strong>สัญญาณที่จับได้:</strong> "+esc((x.key_signals||[]).join(" · "));$("img").src=d.card.image;$("name").textContent=d.card.name;$("read").textContent=d.reading;let u=d.usage||{};$("cost").innerHTML=`<strong>AI TEST COST</strong><br>Analysis: ${u.analysis_input_tokens||0} input + ${u.analysis_output_tokens||0} output tokens<br>Reading: ${u.reading_input_tokens||0} input + ${u.reading_output_tokens||0} output tokens<br>รวม ${u.total_tokens||0} tokens · ประมาณ $${Number(u.estimated_usd||0).toFixed(6)}`;$("s").textContent="อ่านเสร็จแล้ว";$("out").classList.remove("hidden");scrollTo({top:$("out").offsetTop-20,behavior:"smooth"})}catch(e){$("s").innerHTML='<span class="err">'+esc(e.message)+'</span>'}finally{go.disabled=false}};function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]))}
</script></body></html>
